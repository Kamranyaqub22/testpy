[metadata]
name = btl_calc_py
version = 0.1.0
description = A Python project for Buy-to-Let calculations
author = Your Name
author_email = your.email@example.com
license = MIT

[options]
packages = find:
install_requires =
    numpy
    pandas

[options.packages.find]
where = src

[tool:pytest]
testpaths = tests
python_files = test_*.py

[flake8]
max-line-length = 88
extend-ignore = E203, E266, E501
exclude = .git,__pycache__,docs,old,build,dist

[coverage:run]
branch = True
source = src/btl_calc

[coverage:report]
show_missing = True
skip_covered = True